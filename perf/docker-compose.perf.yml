# Perf-test override.
#
# The provider selected via PUT /api/config/providers is stored in a Python
# module global (app/config.py) and is lost on every container restart, and
# get_llm_provider() reads settings.llm_provider directly so it ignores the
# toggle entirely. Pinning the env vars here makes the provider deterministic
# for repeatable test runs without editing the app's .env.
#
# Usage:
#   docker compose -f docker-compose.yml -f perf/docker-compose.perf.yml up -d --build
services:
  backend:
    environment:
      EMBEDDING_PROVIDER: ollama
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_MODEL: qwen2.5-coder:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
      # Test corpus. Override PERF_HOST_DIR to point at your own projects.
      - "${PERF_HOST_DIR:-D:/Code/Projects}:${PERF_MOUNT_PATH:-/host/projects}"

volumes:
  backend_data:

