# Docker Compose for Semantic Code Search
#
# Two deployment modes:
#
# 1. FULL (default): All services run in Docker
#    docker compose up -d
#
# 2. EXTERNAL: Use existing Postgres + Qdrant, only run app services
#    docker compose --profile external up -d backend frontend
#    Set DATABASE_URL, QDRANT_URL, QDRANT_API_KEY in .env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semantic_code
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/semantic_code
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
    # Allow the container to reach services on the host machine
    # (e.g. Ollama running on your machine). Use http://host.docker.internal:11434
    # in the model config instead of http://localhost:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/health', timeout=3); sys.exit(0)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  backend_data:
